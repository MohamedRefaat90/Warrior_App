name: Shorebird Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deployment type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - release
      platform:
        description: 'Platform to deploy'
        required: true
        default: 'android'
        type: choice
        options:
        - android
        - ios
        - both

env:
  FLUTTER_VERSION: "3.32.0"

jobs:
  # Determine deployment strategy
  determine-strategy:
    runs-on: ubuntu-latest
    outputs:
      deploy_type: ${{ steps.strategy.outputs.deploy_type }}
      should_deploy: ${{ steps.strategy.outputs.should_deploy }}
      version_changed: ${{ steps.strategy.outputs.version_changed }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine deployment strategy
      id: strategy
      run: |
        # Check if this is a manual trigger
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "deploy_type=${{ github.event.inputs.deploy_type }}" >> $GITHUB_OUTPUT
          echo "should_deploy=true" >> $GITHUB_OUTPUT
          echo "Manual deployment triggered: ${{ github.event.inputs.deploy_type }}"
          exit 0
        fi
        
        # Check if this is a tag push (release)
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          echo "deploy_type=release" >> $GITHUB_OUTPUT
          echo "should_deploy=true" >> $GITHUB_OUTPUT
          echo "Tag detected, deploying release"
          exit 0
        fi
        
        # Check if version changed in pubspec.yaml (release)
        if git diff HEAD~1 HEAD --name-only | grep -q "pubspec.yaml"; then
          if git diff HEAD~1 HEAD pubspec.yaml | grep -q "^+version:"; then
            echo "deploy_type=release" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "Version change detected, deploying release"
            exit 0
          fi
        fi
        
        # Default: patch deployment for main branch
        if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
          echo "deploy_type=patch" >> $GITHUB_OUTPUT
          echo "should_deploy=true" >> $GITHUB_OUTPUT
          echo "Main branch push detected, deploying patch"
        else
          echo "should_deploy=false" >> $GITHUB_OUTPUT
          echo "No deployment needed"
        fi

  # Run tests before deployment
  test:
    needs: [determine-strategy]
    uses: ./.github/workflows/tests.yaml
    secrets: inherit

  # Shorebird deployment
  deploy:
    runs-on: ubuntu-latest
    needs: [determine-strategy, test]
    if: needs.determine-strategy.outputs.should_deploy == 'true'
    strategy:
      matrix:
        platform: ${{ github.event.inputs.platform == 'both' && fromJson('["android", "ios"]') || fromJson(format('["{0}"]', github.event.inputs.platform || 'android')) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true

    - name: Setup Java (for Android)
      if: matrix.platform == 'android'
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Install dependencies
      run: flutter pub get

    - name: Install Shorebird CLI
      run: |
        # Install Shorebird CLI
        curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
        echo "$HOME/.shorebird/bin" >> $GITHUB_PATH

    - name: Authenticate with Shorebird
      run: |
        # Create credentials file from secret
        mkdir -p ~/.config/shorebird
        echo '${{ secrets.SHOREBIRD_TOKEN }}' > ~/.config/shorebird/credentials.json

    - name: Verify Shorebird setup
      run: |
        shorebird doctor

    - name: Deploy Release
      if: needs.determine-strategy.outputs.deploy_type == 'release'
      run: |
        echo "🚀 Creating Shorebird release for ${{ matrix.platform }}"
        shorebird release ${{ matrix.platform }} --force

    - name: Deploy Patch
      if: needs.determine-strategy.outputs.deploy_type == 'patch'
      run: |
        echo "🔄 Creating Shorebird patch for ${{ matrix.platform }}"
        shorebird patch ${{ matrix.platform }} --force

    - name: Upload artifacts (Android)
      if: matrix.platform == 'android'
      uses: actions/upload-artifact@v4
      with:
        name: android-${{ needs.determine-strategy.outputs.deploy_type }}
        path: |
          build/app/outputs/bundle/release/app-release.aab
          build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

    - name: Upload artifacts (iOS)
      if: matrix.platform == 'ios' && runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: ios-${{ needs.determine-strategy.outputs.deploy_type }}
        path: |
          build/ios/ipa/*.ipa
        retention-days: 30

  # Notification
  notify:
    runs-on: ubuntu-latest
    needs: [determine-strategy, deploy]
    if: always() && needs.determine-strategy.outputs.should_deploy == 'true'
    steps:
    - name: Create deployment summary
      run: |
        echo "## 🚀 Shorebird Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Deployment Type:** ${{ needs.determine-strategy.outputs.deploy_type }}" >> $GITHUB_STEP_SUMMARY
        echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch/Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.deploy.result }}" = "success" ]; then
          echo "✅ **Status:** Deployment successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.determine-strategy.outputs.deploy_type }}" = "release" ]; then
            echo "- Upload the app bundle to Play Store/App Store" >> $GITHUB_STEP_SUMMARY
            echo "- Test the release build thoroughly" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Users will receive the patch on next app restart" >> $GITHUB_STEP_SUMMARY
            echo "- Monitor app performance and user feedback" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "❌ **Status:** Deployment failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the deployment logs for details." >> $GITHUB_STEP_SUMMARY
        fi 