name: Warrior
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+3

environment:
  sdk: ^3.5.3

dependencies:
  another_flushbar: null
  cached_network_image: null
  cached_video_player_plus: ^3.0.3
  change_app_package_name: null
  connectivity_plus: null
  cupertino_icons: null
  device_preview: null
  dio: null
  firebase_analytics: ^11.4.5
  firebase_core: null
  firebase_crashlytics: ^4.3.5
  firebase_messaging: ^15.2.10
  flutter:
    sdk: flutter
  flutter_cache_manager: null
  flutter_dotenv: null
  flutter_launcher_icons: null
  flutter_local_notifications: ^19.4.2
  flutter_native_splash: null
  flutter_riverpod: null
  flutter_screenutil: null
  flutter_secure_storage: ^9.2.4
  flutter_svg: null
  go_router: null
  google_fonts: null
  google_sign_in: null
  hive: null
  hive_flutter: null
  lottie: null
  oktoast: ^3.4.0
  otp_timer_button: null
  page_transition: null
  pinput: null
  pretty_dio_logger: null
  sentry_flutter: ^9.6.0
  shared_preferences: ^2.3.5
  smooth_page_indicator: null
  talker_dio_logger: ^4.6.7

dev_dependencies:
  build_runner: null
  fake_async: ^1.3.1
  flutter_lints: null
  flutter_test:
    sdk: flutter
  hive_generator: null
  integration_test:
    sdk: flutter
  # Testing dependencies
  mockito: ^5.4.4
  mocktail: ^1.0.3
  network_image_mock: ^2.1.1
  sentry_dart_plugin: ^3.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/onboarding/
    - assets/images/signup/
    - assets/images/home/
    - assets/animation/
    - shorebird.yaml
  #   - images/a_dot_ham.jpeg
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

    - family: Kings
      fonts:
        - asset: assets/fonts/Kings-Regular.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: warrior-07
