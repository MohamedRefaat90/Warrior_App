name: Google Play Store Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track'
        required: true
        default: 'internal'
        type: choice
        options:
        - internal
        - alpha
        - beta
        - production

env:
  FLUTTER_VERSION: "3.32.0"

jobs:
  # Run tests before publishing
  test:
    uses: ./.github/workflows/tests.yaml
    secrets: inherit

  # Build and publish to Google Play Store
  publish:
    name: Build & Publish to Google Play Store
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.2.3"
        bundler-cache: true
        working-directory: android

    - name: Install Flutter Dependencies
      run: flutter pub get

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        mkdir -p android/app/keystore
        echo $ENCODED_STRING | base64 -d > android/app/keystore/upload-keystore.jks

    - name: Create key.properties
      run: |
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "storeFile=keystore/upload-keystore.jks" >> android/key.properties

    - name: Create Google Play Service Account Key
      run: |
        echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}' > android/fastlane/google-play-service-account.json

    - name: Build Release Bundle
      run: flutter build appbundle --release

    - name: Upload to Google Play Store
      run: |
        bundle exec fastlane android deploy_to_play_store track:${{ github.event.inputs.track || 'internal' }}
      working-directory: android

    - name: Upload Bundle as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: warrior-app-bundle
        path: build/app/outputs/bundle/release/app-release.aab
        retention-days: 90 