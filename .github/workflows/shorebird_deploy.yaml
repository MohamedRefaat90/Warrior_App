name: Shorebird Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deployment type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - release

env:
  FLUTTER_VERSION: "3.32.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: flutter packages pub run build_runner build --delete-conflicting-outputs

    - name: Test build
      run: flutter build apk --debug

    - name: Install and Setup Shorebird CLI
      run: |
        curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
        mkdir -p ~/.config/shorebird
        echo '${{ secrets.SHOREBIRD_TOKEN }}' > ~/.config/shorebird/credentials.json
        $HOME/.config/shorebird/bin/shorebird doctor

    - name: Deploy
      run: |
        # Determine deployment type
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          DEPLOY_TYPE="${{ github.event.inputs.deploy_type }}"
        else
          DEPLOY_TYPE="patch"  # Default for push events
        fi
        
        if [ "$DEPLOY_TYPE" = "release" ]; then
          echo "🚀 Creating Shorebird release"
          $HOME/.config/shorebird/bin/shorebird release android --force
        else
          echo "🔄 Creating Shorebird patch"
          $HOME/.config/shorebird/bin/shorebird patch android --force
        fi 