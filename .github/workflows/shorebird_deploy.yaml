name: Shorebird Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deployment type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - release

env:
  FLUTTER_VERSION: "3.32.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 10

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: flutter packages pub run build_runner build --delete-conflicting-outputs

    - name: Test build
      run: flutter build apk --debug

    - name: Install and Setup Shorebird CLI
      run: |
        curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
        mkdir -p ~/.config/shorebird
        echo '${{ secrets.SHOREBIRD_TOKEN }}' > ~/.config/shorebird/credentials.json
        $HOME/.config/shorebird/bin/shorebird doctor

    - name: Deploy
      run: |
        # Determine deployment type
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          DEPLOY_TYPE="${{ github.event.inputs.deploy_type }}"
        else
          # Check for asset changes in recent commits
          echo "🔍 Checking for asset changes in recent commits..."
          
          # Try to get git history, fallback to release mode if insufficient history
          if git rev-parse --verify HEAD~5 >/dev/null 2>&1; then
            ASSET_CHANGES=$(git diff --name-only HEAD~5..HEAD | grep -E '\.(png|jpg|jpeg|svg|gif|webp|json|txt|md|yaml|xml)$|assets/|web/|NOTICES' || true)
            
            if [ -n "$ASSET_CHANGES" ]; then
              echo "🔍 Asset changes detected:"
              echo "$ASSET_CHANGES"
              DEPLOY_TYPE="release"
              echo "📦 Switching to release mode due to asset changes"
              echo "ℹ️  Asset changes include: SVG files, images, NOTICES, or configuration files"
            else
              DEPLOY_TYPE="patch"
              echo "🔄 No asset changes detected, using patch mode"
            fi
          else
            echo "⚠️  Insufficient git history, defaulting to release mode"
            DEPLOY_TYPE="release"
          fi
        fi
        
        echo "📋 Deployment type: $DEPLOY_TYPE"
        
        if [ "$DEPLOY_TYPE" = "release" ]; then
          echo "🚀 Creating Shorebird release"
          if ! $HOME/.config/shorebird/bin/shorebird release android --no-confirm; then
            echo "❌ Release failed, this might be due to:"
            echo "   - Asset changes that require a new release"
            echo "   - Configuration issues"
            echo "   - Network connectivity problems"
            exit 1
          fi
        else
          echo "🔄 Creating Shorebird patch"
          if ! $HOME/.config/shorebird/bin/shorebird patch android --no-confirm; then
            echo "❌ Patch failed, falling back to release mode"
            echo "🚀 Creating Shorebird release as fallback"
            $HOME/.config/shorebird/bin/shorebird release android --no-confirm
          fi
        fi 