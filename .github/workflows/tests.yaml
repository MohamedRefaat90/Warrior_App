name: Tests & Quality Checks

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
        
    - name: Restore .env file
      run: |
        echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
      if: env.ENV_FILE_CONTENT != ''
      env:
        ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        
    - name: Get Flutter Dependencies
      run: flutter pub get
      
    - name: Generate Code (Hive, etc.)
      run: flutter packages pub run build_runner build --delete-conflicting-outputs
      
    - name: Verify Flutter Installation
      run: flutter doctor -v
      
    - name: Analyze Code
      run: flutter analyze
      
    - name: Check Code Formatting
      run: dart format --set-exit-if-changed .
      
    - name: Run Unit Tests
      run: flutter test test/unit/ --reporter=expanded
      
    - name: Run Widget Tests
      run: flutter test test/widget/ --reporter=expanded
      
    - name: Run All Tests with Coverage
      run: flutter test --coverage --reporter=expanded
      
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: coverage/lcov.info
        flags: unittests
        name: warrior-app-coverage
      if: success()
      
    - name: Generate Coverage Report
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov
        genhtml coverage/lcov.info -o coverage/html
      if: success()
      
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/html/
        retention-days: 30
      if: success()
      
    - name: Check Build (Debug)
      run: flutter build apk --debug
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 7
      if: success()

  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
        
    - name: Restore .env file
      run: |
        echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
      if: env.ENV_FILE_CONTENT != ''
      env:
        ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        
    - name: Get Flutter Dependencies
      run: flutter pub get
      
    - name: Generate Code (Hive, etc.)
      run: flutter packages pub run build_runner build --delete-conflicting-outputs
      
    - name: Run Integration Tests
      run: flutter test integration_test/ --reporter=expanded
      
    - name: Upload Integration Test Results
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: integration_test/
        retention-days: 7
      if: always()

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
        
    - name: Restore .env file
      run: |
        echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
      if: env.ENV_FILE_CONTENT != ''
      env:
        ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        
    - name: Get Flutter Dependencies
      run: flutter pub get
      
    - name: Generate Code (Hive, etc.)
      run: flutter packages pub run build_runner build --delete-conflicting-outputs
      
    - name: Build Release APK
      run: flutter build apk --release
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7
      if: success()

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, integration-test, build-validation]
    if: always()
    
    steps:
    - name: Check Results
      run: |
        echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Tests & Quality | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | ${{ needs.integration-test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build Validation | ${{ needs.build-validation.result }} |" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.test.result }}" == "success" && "${{ needs.integration-test.result }}" == "success" && "${{ needs.build-validation.result }}" == "success" ]]; then
          echo "✅ All checks passed! Ready for deployment." >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Some checks failed. Please review the results." >> $GITHUB_STEP_SUMMARY 