name: Firebase Distribution

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [dev]

jobs:
  distribute:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 5
        ref: dev
    - uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Create Android licenses directory
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_HOME/licenses/android-sdk-license
    
    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.0.12433566"
    
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
    
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.2.3"
        bundler-cache: true
        working-directory: android
    
    - run: flutter pub get
    - name: Generate release notes
      id: release_notes
      run: |
        echo "🔍 Debugging git history..."
        git log --oneline -5
        echo ""
        echo "📝 Generating release notes from recent commits..."
        RELEASE_NOTES=$(git log --pretty=format:"• %s" -5 --no-merges | head -5)
        if [ -z "$RELEASE_NOTES" ]; then
          echo "⚠️  No commits found, using fallback"
          RELEASE_NOTES="• Bug fixes and improvements"
        fi
        echo "📋 Generated release notes:"
        echo "$RELEASE_NOTES"
        echo ""
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
        echo "🚀 What's New:" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "📅 Build: $(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT
        echo "🔧 Branch: ${{ github.ref_name }}" >> $GITHUB_OUTPUT
        echo "📝 Commit: ${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    - name: Deploy to Firebase Distribution
      run: |
        echo "🚀 Deploying to Firebase with release notes..."
        echo "Release notes preview:"
        echo "${{ steps.release_notes.outputs.RELEASE_NOTES }}"
        echo ""
        bundle exec fastlane android fbd release_notes:"${{ steps.release_notes.outputs.RELEASE_NOTES }}"
      working-directory: android
      env:
        FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
        OPENFOODFACTS_USER_ID: ${{ secrets.OPENFOODFACTS_USER_ID }}
        OPENFOODFACTS_PASSWORD: ${{ secrets.OPENFOODFACTS_PASSWORD }}  