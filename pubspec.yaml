name: Warrior
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.0+6

environment:
  sdk: ^3.5.3

dependencies:
  another_flushbar: null
  cached_network_image: null
  cached_video_player_plus: ^4.0.4
  video_player: ^2.10.0
  change_app_package_name: null
  connectivity_plus: null
  cupertino_icons: null
  device_preview: null
  dio: null
  firebase_analytics: ^11.4.5
  firebase_core: null
  firebase_crashlytics: ^4.3.5
  firebase_messaging: ^15.2.10
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_cache_manager: null
  flutter_dotenv: null
  flutter_launcher_icons: null
  flutter_local_notifications: ^19.4.2
  flutter_native_splash: null
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: null
  go_router: null
  google_fonts: ^6.3.2
  google_sign_in: null
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  lottie: null
  oktoast: ^3.4.0
  otp_timer_button: null
  page_transition: null
  pinput: null
  pretty_dio_logger: null
  sentry_flutter: ^9.6.0
  shared_preferences: ^2.3.5
  smooth_page_indicator: null
  talker_dio_logger: ^5.0.1
  talker_flutter: ^5.0.1
  talker_riverpod_logger: ^5.0.1
  in_app_review: ^2.0.11
  local_hero_transform: ^1.0.6
  google_mobile_ads: ^6.0.0
  share_plus: ^12.0.0
  fl_chart: ^1.1.1
  animate_do: ^4.2.0
  package_info_plus: ^9.0.0
  flutter_animate: ^4.5.0
  skeletonizer: ^2.1.0+1
  openfoodfacts: ^3.27.0
  flutter_staggered_animations: ^1.1.1
  image_picker: ^1.0.7
  dtd: ^4.0.0
  flutter_lints: ^6.0.0
  json_rpc_2: ^4.0.0
  path: ^1.9.1
  stack_trace: ^1.12.1
  url_launcher: ^6.3.2
  web: ^1.1.1
  google_mlkit_text_recognition: ^0.15.0
  flutter_image_compress: ^2.4.0
  camera: ^0.11.3
  mobile_scanner: ^7.1.3
  confetti: ^0.8.0
  image_cropper: ^11.0.0
  equatable: ^2.0.8

dev_dependencies:
  build_runner: null
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  integration_test:
    sdk: flutter
  # Testing dependencies
  mockito: ^5.4.4
  mocktail: ^1.0.3
  network_image_mock: ^2.1.1
  sentry_dart_plugin: ^3.1.1
  analyzer: ^6.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/images/onboarding/
    - assets/images/signup/
    - assets/images/home/
    - assets/images/muscles/
    - assets/animation/
    - shorebird.yaml
  #   - images/a_dot_ham.jpeg
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

    - family: Kings
      fonts:
        - asset: assets/fonts/Kings-Regular.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# l10n configuration must be at the root level
l10n:
  arb-dir: lib/core/localization/arb
  template-arb-file: en.arb
  output-localization-file: app_localizations.dart

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: warrior-07
